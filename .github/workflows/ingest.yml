name: Сбор вакансий

on:
  schedule:
    - cron: "17 4 * * *"   # каждый день в 07:17 по Москве
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: "За сколько часов брать вакансии"
        default: "48"

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ingest/requirements.txt
      - run: pip install -r ingest/requirements.txt
      - run: python ingest/ingest.py
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          LOOKBACK_HOURS: ${{ inputs.lookback_hours || '48' }}
