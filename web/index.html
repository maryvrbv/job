<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Отклики Маши</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#4DB288">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<section class="login" id="login" hidden>
  <h1>Отклики Маши</h1>
  <p class="sub">В первый раз придумай пароль от 10 символов: аккаунт создастся сам. Дальше входи с ним же.</p>
  <form id="loginForm" style="display:flex;flex-direction:column;gap:8px">
    <input type="email" id="email" required placeholder="you@example.com" autocomplete="email">
    <input type="password" id="password" required minlength="10" placeholder="Пароль" autocomplete="current-password">
    <button class="btn primary" type="submit" style="align-self:flex-start">Войти</button>
  </form>
  <p class="note" id="loginNote"></p>
</section>

<div class="wrap" id="app" hidden>
  <header class="top">
    <div>
      <h1>Отклики Маши</h1>
      <p class="sub"><span class="updated" id="updated"></span></p>
    </div>
    <div class="actions">
      <button class="btn" id="reload" type="button">Обновить</button>
      <label class="btn" for="importFile" title="Перенести данные из Google Таблицы (.xlsx)">Импорт из таблицы</label>
      <input type="file" id="importFile" accept=".xlsx" hidden>
      <button class="btn" id="logout" type="button">Выйти</button>
    </div>
  </header>

  <div id="banner" hidden></div>

  <section class="summary" aria-label="Сводка">
    <div class="stats" id="stats"></div>
    <div class="funnel" id="funnel"></div>
  </section>

  <div class="tabs" role="tablist" id="tabs"></div>
  <p class="intro" id="intro"></p>

  <div class="controls">
    <input type="search" id="q" placeholder="Компания или вакансия" aria-label="Поиск">
    <select id="fFit" aria-label="Совпадение">
      <option value="">Любое совпадение</option>
      <option value="Высокий">Высокое</option>
      <option value="Средний">Среднее</option>
      <option value="Низкий">Низкое</option>
    </select>
    <select id="fFmt" aria-label="Формат работы">
      <option value="">Любой формат</option>
      <option value="удалёнка">Есть удалёнка</option>
      <option value="гибрид">Есть гибрид</option>
      <option value="офис">Офис</option>
    </select>
    <select id="fStatus" aria-label="Статус">
      <option value="active">В работе (без отказов и закрытых)</option>
      <option value="new">Ещё не откликалась</option>
      <option value="process">Идёт процесс</option>
      <option value="closed">Отказы, «Не подходит», закрытые</option>
      <option value="">Все статусы</option>
    </select>
    <select id="sort" aria-label="Сортировка">
      <option value="date" selected>По дате публикации: сначала новые</option>
      <option value="date-old">По дате публикации: сначала старые</option>
      <option value="fit">Сначала высокое совпадение</option>
      <option value="few">Меньше всего откликов</option>
      <option value="company">По компании</option>
      <option value="applied">По дате отклика</option>
    </select>
  </div>

  <div class="pane">
    <div class="list" id="list" aria-label="Вакансии"></div>
    <article class="detail" id="detail" aria-live="polite"></article>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="profile.js"></script>
<script src="app.js"></script>
</body>
</html>
